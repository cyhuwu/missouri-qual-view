<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Access | USS Missouri Qualification Database</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand" aria-label="Home">
      <img src="17859146838312775321325180096476.jpg" alt="USS Missouri icon" class="brand-icon">
    </a>

    <h1 class="site-title">USS Missouri Qualification Database</h1>

    <a class="login-button" href="index.html">HOME</a>
  </header>

  <main class="content access-content">
    <section class="access-card" aria-labelledby="access-title">
      <p class="eyebrow">USS MISSOURI (SSN 780)</p>
      <h2 id="access-title">Database access</h2>
      <p class="access-description">Sign in with your assigned account to continue to the qualification database.</p>

      <form class="access-form" id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <p id="login-error" class="login-error" role="alert" hidden>Incorrect username or password.</p>
        <button class="access-submit" type="submit">Sign in</button>
      </form>
    </section>
  </main>
</body>
</html>
